name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github_release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install semantic release and plugins
        run: |
          npm install -g semantic-release@v24.2.1 \
            conventional-changelog-cli \
            conventional-changelog-conventionalcommits@9.3.1 \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Semantic Release Dry Run
        id: semantic
        run: |
          dry_run_output=$(semantic-release --dry-run 2>&1 || true)

          echo "$dry_run_output"

          # Check if there are no changes
          if [[ "$dry_run_output" == *"no new version is released"* ]]; then
            echo "No new release needed"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract version from dry run output
          version=$(echo "$dry_run_output" | grep -oP "The next release version is \K[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$version" ]; then
            echo "::error ::Could not determine version"
            exit 1
          fi

          echo "new_release_version=$version" >> $GITHUB_OUTPUT

          # Run actual release
          if semantic-release; then
            echo "Release successful"
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "Release failed"
            exit 1
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Capture released commit SHA
        id: release_sha
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          sha=$(git rev-parse --verify "refs/tags/$VERSION^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Build once; TestPyPI and later publish-pypi.yaml use these exact files.
  build:
    name: Build
    needs: github_release
    if: >-
      needs.github_release.outputs.new_release_published == 'true' &&
      needs.github_release.outputs.new_release_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.github_release.outputs.new_release_version }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.github_release.outputs.new_release_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install uv==0.13.4 twine

      - name: Build the package
        run: uv build --out-dir dist --wheel

      - name: Check the package metadata
        run: twine check dist/*

      - name: Check the wheel is there
        run: ls "dist/mloda_plugin_govdata-$VERSION-py3-none-any.whl"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted Publishing: the run's OIDC token is traded for a short-lived upload token, no PyPI secret is stored.
  publish_testpypi:
    name: Publish to TestPyPI
    needs: [github_release, build]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mloda-plugin-govdata/${{ needs.github_release.outputs.new_release_version }}/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # re-run failed jobs only, never `build`

  # publish-pypi.yaml takes the wheel from the GitHub release, so PyPI gets the file TestPyPI got.
  attach_to_release:
    name: Attach to the GitHub release
    needs: [github_release, publish_testpypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.github_release.outputs.new_release_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload the wheel to the release
        run: gh release upload "$VERSION" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
