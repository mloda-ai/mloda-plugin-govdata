[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mloda-plugin-govdata"
# Always start at least at 0.2.0 to make semver work.
# Initial release for semver needs also a manually pushed minimum tag (likely 0.2.0).
version = "0.3.0"
description = "mloda plugin providing connectors, harmonization and recipes for German government data (GovData.de CKAN API, Destatis GENESIS webservice)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Tom Kaltofen", email = "tomkaltofen@mloda.ai" }]
dependencies = [
    "mloda>=0.14.0,<0.15.0",
    "filelock>=3.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/mloda-ai/mloda-plugin-govdata"
Repository = "https://github.com/mloda-ai/mloda-plugin-govdata"
Issues = "https://github.com/mloda-ai/mloda-plugin-govdata/issues"
Releases = "https://github.com/mloda-ai/mloda-plugin-govdata/releases"
"Prototype Fund" = "https://www.prototypefund.de/projects/mloda-plugin-govdata"

[project.optional-dependencies]
demo = ["marimo>=0.14"]
dev = [
    "mloda-testing>=0.5.0",
    "tox",
    "tox-uv",
    "uv>=0.11.15",
    "pytest",
    "ruff",
    "mypy",
    "bandit",
    "hypothesis",
    "respx",
    "pandas-stubs",
    "tomli; python_version < '3.11'",
]

[tool.setuptools]
# Code only: no package data, so a stale egg-info manifest cannot pull test modules back in as data.
# A future data file (a py.typed marker, say) needs an explicit package-data entry.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mloda_plugin_govdata*"]
# Tests stay out of the wheel (and out of the sdist from a clean checkout); the recipe tests read repo-root files anyway.
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["mloda_plugin_govdata", "tests"]
# Tests import the repo-root scripts package, whatever the import mode.
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "live: tests that reach the live GovData / publisher network (deselected by default)",
    "genesis_live: tests that reach a live GENESIS host with credentials (deselected by default; skipped without GENESIS_TOKEN or user plus password)",
]
addopts = "-m 'not live and not genesis_live'"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Marimo notebooks are generated cell functions: a bare trailing expression is the cell's
# displayed output, the trailing `return` is generator structure, and imports live inside
# cells and are re-emitted on every regeneration. Linting these fights the generator.
"demos/*" = ["B018", "PLR1711", "I001"]

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# Marimo notebooks are generated cell functions without annotations; not library code. A local wheel
# build leaves a copy of the package under build/, which would otherwise be checked twice.
exclude = ["^demos/", "^build/"]

[tool.bandit]
exclude_dirs = [".tox", ".venv", "tests"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { mloda = "2026-12-31", "mloda-testing" = "2026-12-31", "mloda-registry" = "2026-12-31" }
# Overrides, not constraints: marimo pins `pymdown-extensions<11`, and the fix for the
# b64 path-traversal advisory only ships in 11.0. A constraint cannot beat that upper
# pin, so the pin is overridden here. Drop this once marimo allows 11.x.
override-dependencies = [
    "pymdown-extensions>=11.0.1",
]
