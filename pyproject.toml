[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mloda-plugin-govdata"
# Always start at least at 0.2.0 to make semver work.
# Initial release for semver needs also a manually pushed minimum tag (likely 0.2.0).
version = "0.3.4"
description = "mloda plugin providing connectors and harmonization for German government data (GovData.de CKAN API, Destatis GENESIS API v3)."
license = "Apache-2.0"
authors = [{ name = "Tom Kaltofen", email = "tomkaltofen@mloda.ai" }]
dependencies = [
    "mloda>=0.10.0,<0.11.0",
    "mloda-testing>=0.3.1",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
demo = ["marimo>=0.14"]
dev = [
    "tox",
    "tox-uv",
    "uv>=0.11.15",
    "pytest",
    "ruff",
    "mypy",
    "bandit",
    "hypothesis",
    "respx",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mloda_plugin_govdata*"]

[tool.pytest.ini_options]
testpaths = ["mloda_plugin_govdata", "tests"]
python_files = ["test_*.py"]
markers = ["live: tests that reach the live GovData / publisher network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# Marimo notebooks are generated cell functions without annotations; not library code.
exclude = ["^demos/"]

[tool.bandit]
exclude_dirs = [".tox", ".venv", "tests"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { mloda = "2026-12-31", "mloda-testing" = "2026-12-31", "mloda-registry" = "2026-12-31" }
# Overrides, not constraints: marimo pins `pymdown-extensions<11`, and the fix for the
# b64 path-traversal advisory only ships in 11.0. A constraint cannot beat that upper
# pin, so the pin is overridden here. Drop this once marimo allows 11.x.
override-dependencies = [
    "pymdown-extensions>=11.0.1",
]
